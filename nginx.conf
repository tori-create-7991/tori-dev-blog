server {
    listen 8080;
    server_name localhost;

    # Nuxtのビルド出力ディレクトリを指定
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; upgrade-insecure-requests";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header X-Content-Type-Options "nonce" always;
    add_header X-Frame-Options "DENY" always;
    # add_header X-XSS-Protection "1; mode=block" always;

    # Cloud Run specific settings
    client_max_body_size 0;
    keepalive_timeout 0;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # gzip設定
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静的アセットのキャッシュ設定
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 画像ファイルのキャッシュ設定
    location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Nuxtのペイロードファイルの設定
    location = /_payload.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/json";
    }

    # タグページの設定
    location /tag/ {
        try_files $uri $uri.html /tag.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # カテゴリーページの設定
    location /category/ {
        try_files $uri $uri.html /category.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 投稿ページの設定
    location /posts/ {
        try_files $uri $uri.html =404;
    }

    # サイドコンテンツの設定
    location /sidecontent/ {
        try_files $uri $uri.html =404;
    }

    # メインのルーティング設定
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # エラーページ設定
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # HTTPSへのリダイレクト
    error_page 497 @force_https;
    location @force_https {
        return 301 'https://$host$request_uri';
    }
}
